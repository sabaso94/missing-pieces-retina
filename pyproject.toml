[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "retina_shift"
version = "0.1.0"
description = "A diabetic retinopathy screening model at clinics it never saw: shift detection, label-free monitoring and few-label repair"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
